<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="gentleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="firmGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Tabero · 语言条件化轻柔抓取力控</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Franka 机械臂 · GelSight 视触觉 · 力-位解耦实时控制</text>

  <!-- 左：力-位解耦概念图 -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="380" height="450" rx="10" fill="#fafafa" stroke="#e5e7eb"/>
    <text x="190" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">力-位解耦控制架构</text>

    <!-- 语言指令输入 -->
    <g transform="translate(30, 55)">
      <rect x="0" y="0" width="320" height="40" rx="8" fill="#ede9fe" stroke="#a78bfa"/>
      <text x="160" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#5b21b6">🗣️ 语言指令（如"轻柔地抓住鸡蛋"）</text>
    </g>

    <text x="190" y="112" text-anchor="middle" font-size="18" fill="#9ca3af">↓</text>

    <!-- 解耦 -->
    <g transform="translate(30, 125)">
      <rect x="0" y="0" width="150" height="60" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="75" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">位置控制通道</text>
      <text x="75" y="45" text-anchor="middle" font-size="11" fill="#3b82f6">运动轨迹 / 抓取位置</text>
    </g>
    <g transform="translate(200, 125)">
      <rect x="0" y="0" width="150" height="60" rx="8" fill="#dcfce7" stroke="#4ade80"/>
      <text x="75" y="25" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">力控制通道</text>
      <text x="75" y="45" text-anchor="middle" font-size="11" fill="#16a34a">握力大小 / 接触力</text>
    </g>

    <text x="190" y="212" text-anchor="middle" font-size="18" fill="#9ca3af">↓</text>

    <!-- 机械臂 -->
    <g transform="translate(90, 225)">
      <rect x="0" y="0" width="200" height="70" rx="10" fill="#1f2937" stroke="#374151"/>
      <text x="100" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#f3f4f6">🤖 Franka 机械臂</text>
      <text x="100" y="50" text-anchor="middle" font-size="11" fill="#9ca3af">+ 视触觉夹爪 (GelSight Mini)</text>
    </g>

    <text x="190" y="318" text-anchor="middle" font-size="18" fill="#9ca3af">↓</text>

    <!-- 输出 -->
    <g transform="translate(30, 330)">
      <rect x="0" y="0" width="320" height="100" rx="8" fill="#ecfeff" stroke="#22d3ee"/>
      <text x="160" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#0e7490">双目标同时优化</text>
      <text x="160" y="52" text-anchor="middle" font-size="12" fill="#0891b2">✓ 任务成功率（Goal Success）</text>
      <text x="160" y="72" text-anchor="middle" font-size="12" fill="#0891b2">✓ 握力质量（交互轻柔度）</text>
      <text x="160" y="92" text-anchor="middle" font-size="12" fill="#0891b2">✓ 语言指令跟随</text>
    </g>
  </g>

  <!-- 右：握力对比曲线 -->
  <g transform="translate(480, 90)">
    <text x="340" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">牢固抓取 vs 轻柔抓取 握力包络对比</text>
    <text x="340" y="18" text-anchor="middle" font-size="11" fill="#6b7280">归一化握力 · 装配任务全程 · 平均降低 70%+</text>

    <!-- 坐标系 -->
    <line x1="50" y1="40" x2="50" y2="320" stroke="#374151" stroke-width="1.5"/>
    <line x1="50" y1="320" x2="640" y2="320" stroke="#374151" stroke-width="1.5"/>

    <!-- 网格 -->
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="50" y1="90" x2="640" y2="90"/>
      <line x1="50" y1="150" x2="640" y2="150"/>
      <line x1="50" y1="210" x2="640" y2="210"/>
      <line x1="50" y1="270" x2="640" y2="270"/>
    </g>

    <!-- Y轴 -->
    <text x="45" y="45" text-anchor="end" font-size="11" fill="#6b7280">最大</text>
    <text x="45" y="150" text-anchor="end" font-size="11" fill="#6b7280">中等</text>
    <text x="45" y="270" text-anchor="end" font-size="11" fill="#6b7280">最小</text>
    <text x="20" y="180" font-size="11" fill="#4b5563" transform="rotate(-90 20 180)" text-anchor="middle">握力（归一化）</text>

    <!-- X轴 -->
    <text x="50" y="338" text-anchor="middle" font-size="11" fill="#6b7280">开始</text>
    <text x="200" y="338" text-anchor="middle" font-size="11" fill="#6b7280">接近</text>
    <text x="350" y="338" text-anchor="middle" font-size="11" fill="#6b7280">抓取</text>
    <text x="500" y="338" text-anchor="middle" font-size="11" fill="#6b7280">操作</text>
    <text x="640" y="338" text-anchor="middle" font-size="11" fill="#6b7280">释放</text>
    <text x="345" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">操作阶段</text>

    <!-- 牢固抓取 曲线（高握力） -->
    <path d="M50,290 L120,280 L200,260 L280,180 L350,80 L420,70 L500,75 L580,95 L640,280"
          fill="none" stroke="#ef4444" stroke-width="3" stroke-linejoin="round"/>
    <!-- 填充区域 -->
    <path d="M50,290 L120,280 L200,260 L280,180 L350,80 L420,70 L500,75 L580,95 L640,280 L640,320 L50,320 Z"
          fill="#ef4444" opacity="0.15"/>

    <!-- 轻柔抓取 曲线（低握力，70%降低） -->
    <path d="M50,300 L120,295 L200,285 L280,250 L350,220 L420,210 L500,215 L580,230 L640,295"
          fill="none" stroke="#10b981" stroke-width="3" stroke-linejoin="round"/>
    <path d="M50,300 L120,295 L200,285 L280,250 L350,220 L420,210 L500,215 L580,230 L640,295 L640,320 L50,320 Z"
          fill="#10b981" opacity="0.15"/>

    <!-- 70%降低标注线 -->
    <line x1="420" y1="70" x2="420" y2="210" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
    <g transform="translate(430, 130)">
      <rect x="0" y="-20" width="130" height="40" rx="6" fill="#fffbeb" stroke="#fbbf24"/>
      <text x="65" y="-2" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">↓ 70%+</text>
      <text x="65" y="14" text-anchor="middle" font-size="10" fill="#92400e">握力降低幅度</text>
    </g>

    <!-- 图例 -->
    <g transform="translate(420, 45)">
      <rect x="0" y="0" width="200" height="55" rx="6" fill="white" stroke="#e5e7eb"/>
      <line x1="15" y1="18" x2="45" y2="18" stroke="#ef4444" stroke-width="3"/>
      <text x="55" y="22" font-size="12" fill="#374151">牢固抓取（firm）</text>
      <line x1="15" y1="38" x2="45" y2="38" stroke="#10b981" stroke-width="3"/>
      <text x="55" y="42" font-size="12" fill="#374151">轻柔抓取（gentle）</text>
    </g>

    <!-- 底部数据点 -->
    <g transform="translate(0, 385)">
      <rect x="0" y="0" width="680" height="55" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text x="20" y="22" font-size="12" fill="#166534">
        <tspan font-weight="700">关键结论：</tspan>"轻柔"指令下握力平均降低 70% 以上，同时任务成功率保持在高水平
      </text>
      <text x="20" y="42" font-size="12" fill="#15803d">
        证明了语言条件化力控可有效实现易碎物体安全抓取，为实际机器人"按需调节握力"提供可复现范式。
      </text>
    </g>
  </g>

  <text x="600" y="585" text-anchor="middle" font-size="11" fill="#9ca3af">
    数据来源：Tabero (NathanWu7/Isaaclab_Libero) · 40 个装配演示 · Franka + GelSight Mini 视触觉仿真资产已下载
  </text>
</svg>