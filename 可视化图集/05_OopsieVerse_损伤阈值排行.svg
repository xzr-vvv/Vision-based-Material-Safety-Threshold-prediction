<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="fragileGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">OopsieVerse · 损伤仿真与易碎物体安全力基准</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#6b7280">DamageSim · 30+ 物体损伤阈值 · 接触力 → 可量化健康值</text>

  <!-- 顶部4个KPI -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="#fef2f2" stroke="#fecaca"/>
    <text x="100" y="30" text-anchor="middle" font-size="26" font-weight="700" fill="#991b1b">10</text>
    <text x="100" y="52" text-anchor="middle" font-size="12" fill="#b91c1c">鸡蛋损伤阈值（最易碎）</text>
  </g>
  <g transform="translate(280, 80)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="100" y="30" text-anchor="middle" font-size="26" font-weight="700" fill="#92400e">40</text>
    <text x="100" y="52" text-anchor="middle" font-size="12" fill="#b45309">盘子/碗/镜子 阈值</text>
  </g>
  <g transform="translate(500, 80)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="100" y="30" text-anchor="middle" font-size="26" font-weight="700" fill="#166534">500</text>
    <text x="100" y="52" text-anchor="middle" font-size="12" fill="#15803d">易拉罐/家具 阈值</text>
  </g>
  <g transform="translate(720, 80)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="100" y="30" text-anchor="middle" font-size="26" font-weight="700" fill="#1e40af">1000</text>
    <text x="100" y="52" text-anchor="middle" font-size="12" fill="#3b82f6">书本（最坚固参照物）</text>
  </g>
  <g transform="translate(940, 80)">
    <rect x="0" y="0" width="200" height="70" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="100" y="30" text-anchor="middle" font-size="26" font-weight="700" fill="#5b21b6">32</text>
    <text x="100" y="52" text-anchor="middle" font-size="12" fill="#7c3aed">标定损伤参数的物体</text>
  </g>

  <!-- 主体：30物体损伤阈值条形图（分4组） -->
  <g transform="translate(60, 175)">
    <text x="0" y="0" font-size="15" font-weight="600" fill="#1f2937">各物体 damage_threshold（损伤阈值，相对力单位）</text>
    <text x="0" y="18" font-size="11" fill="#6b7280">数值越低越易碎 · 按易碎程度从高到低排列 · 共 30+ 物体（选取代表）</text>

    <!-- 4个分组 -->
    <!-- 第1组：极易碎 10~20 -->
    <g transform="translate(0, 35)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#991b1b">▎极易碎（阈值 10~20）</text>

      <!-- 鸡蛋 10 -->
      <g transform="translate(0, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🥚 鸡蛋 egg</text>
        <rect x="120" y="4" width="18" height="18" rx="3" fill="#fef2f2" stroke="#fca5a5"/>
        <rect x="120" y="4" width="18" height="18" rx="3" fill="#dc2626"/>
        <text x="148" y="17" font-size="11" fill="#dc2626" font-weight="700">10</text>
      </g>
      <!-- 酒杯 15 -->
      <g transform="translate(180, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🍷 酒杯</text>
        <rect x="120" y="4" width="27" height="18" rx="3" fill="#dc2626"/>
        <text x="157" y="17" font-size="11" fill="#dc2626" font-weight="700">15</text>
      </g>
      <!-- 啤酒瓶 15 -->
      <g transform="translate(330, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🍺 啤酒瓶</text>
        <rect x="120" y="4" width="27" height="18" rx="3" fill="#dc2626"/>
        <text x="157" y="17" font-size="11" fill="#dc2626" font-weight="700">15</text>
      </g>
      <!-- 纸杯蛋糕 20 -->
      <g transform="translate(480, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🧁 纸杯蛋糕</text>
        <rect x="120" y="4" width="36" height="18" rx="3" fill="#ef4444"/>
        <text x="166" y="17" font-size="11" fill="#dc2626" font-weight="700">20</text>
      </g>
      <!-- 陶瓷杯 20 -->
      <g transform="translate(660, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">☕ 陶瓷杯</text>
        <rect x="120" y="4" width="36" height="18" rx="3" fill="#ef4444"/>
        <text x="166" y="17" font-size="11" fill="#dc2626" font-weight="700">20</text>
      </g>
    </g>

    <!-- 第2组：较易碎 40~80 -->
    <g transform="translate(0, 95)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#b45309">▎较易碎（阈值 40~80）</text>

      <g transform="translate(0, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🪞 镜子</text>
        <rect x="120" y="4" width="72" height="18" rx="3" fill="#f59e0b"/>
        <text x="202" y="17" font-size="11" fill="#92400e" font-weight="700">40</text>
      </g>
      <g transform="translate(220, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🍽️ 盘子</text>
        <rect x="120" y="4" width="72" height="18" rx="3" fill="#f59e0b"/>
        <text x="202" y="17" font-size="11" fill="#92400e" font-weight="700">40</text>
      </g>
      <g transform="translate(400, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🥣 碗</text>
        <rect x="120" y="4" width="72" height="18" rx="3" fill="#f59e0b"/>
        <text x="202" y="17" font-size="11" fill="#92400e" font-weight="700">40</text>
      </g>
      <g transform="translate(580, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🍾 酒瓶</text>
        <rect x="120" y="4" width="90" height="18" rx="3" fill="#f59e0b"/>
        <text x="220" y="17" font-size="11" fill="#92400e" font-weight="700">50</text>
      </g>
      <g transform="translate(810, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🏺 花瓶</text>
        <rect x="120" y="4" width="90" height="18" rx="3" fill="#f59e0b"/>
        <text x="220" y="17" font-size="11" fill="#92400e" font-weight="700">50</text>
      </g>
    </g>

    <!-- 第3组：中等坚固 100~300 -->
    <g transform="translate(0, 155)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#15803d">▎中等坚固（阈值 100~300）</text>

      <g transform="translate(0, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">📷 数码相机</text>
        <rect x="120" y="4" width="108" height="18" rx="3" fill="#10b981"/>
        <text x="238" y="17" font-size="11" fill="#065f46" font-weight="700">60</text>
      </g>
      <g transform="translate(260, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">💻 笔记本电脑</text>
        <rect x="120" y="4" width="144" height="18" rx="3" fill="#10b981"/>
        <text x="274" y="17" font-size="11" fill="#065f46" font-weight="700">80</text>
      </g>
      <g transform="translate(540, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">📺 电视</text>
        <rect x="120" y="4" width="144" height="18" rx="3" fill="#10b981"/>
        <text x="274" y="17" font-size="11" fill="#065f46" font-weight="700">80</text>
      </g>
      <g transform="translate(820, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🎙️ 三脚架</text>
        <rect x="120" y="4" width="270" height="18" rx="3" fill="#10b981"/>
        <text x="400" y="17" font-size="11" fill="#065f46" font-weight="700">150</text>
      </g>
    </g>

    <!-- 第4组：坚固 500~1000 -->
    <g transform="translate(0, 215)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#1e40af">▎坚固（阈值 500~1000）</text>

      <g transform="translate(0, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🥫 易拉罐</text>
        <rect x="120" y="4" width="450" height="18" rx="3" fill="#3b82f6"/>
        <text x="580" y="17" font-size="11" fill="#1e40af" font-weight="700">500</text>
      </g>
      <g transform="translate(620, 18)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🛋️ 沙发</text>
        <rect x="120" y="4" width="450" height="18" rx="3" fill="#3b82f6"/>
        <text x="580" y="17" font-size="11" fill="#1e40af" font-weight="700">500</text>
      </g>
      <g transform="translate(0, 45)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">🚪 门</text>
        <rect x="120" y="4" width="450" height="18" rx="3" fill="#3b82f6"/>
        <text x="580" y="17" font-size="11" fill="#1e40af" font-weight="700">300</text>
      </g>
      <g transform="translate(620, 45)">
        <text x="110" y="14" text-anchor="end" font-size="11" fill="#374151">📚 书本</text>
        <rect x="120" y="4" width="900" height="18" rx="3" fill="#2563eb"/>
        <text x="1030" y="17" font-size="11" fill="#1e40af" font-weight="700">1000</text>
      </g>
    </g>

    <!-- 底部说明 -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="1080" height="60" rx="8" fill="#fffbeb" stroke="#fde68a"/>
      <text x="20" y="24" font-size="12" fill="#78350f">
        <tspan font-weight="700">注意：</tspan>damage_threshold 为仿真相对力单位，非真实牛顿。但相对比例关系具有物理意义：
      </text>
      <text x="20" y="44" font-size="12" fill="#78350f">
        鸡蛋 : 酒杯 : 酒瓶 : 盘子 : 书本 ≈ 1 : 1.5 : 5 : 4 : 100，可用于标定不同类别物体安全抓取力的相对比例。
      </text>
    </g>
  </g>

  <text x="600" y="585" text-anchor="middle" font-size="11" fill="#9ca3af">
    数据来源：OopsieVerse (ut-robin-lab) · damage_params.py 完整 30+ 物体参数 · 54 条安全/不安全演示已全部下载
  </text>
</svg>