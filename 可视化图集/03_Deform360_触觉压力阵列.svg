<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="pressBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="timeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Deform360 · 双臂触觉夹爪多视图数据集</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#6b7280">BRICS 穹顶 · 41 相机 + 双手 16×32 触觉阵列 · 198 个可变形物体</text>

  <!-- 左：触觉压力阵列（16x32，左夹爪） -->
  <g transform="translate(50, 90)">
    <text x="240" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">触觉压力阵列 16×32（左夹爪·左指面）</text>
    <text x="240" y="18" text-anchor="middle" font-size="11" fill="#6b7280">tactile_left sensor · 绳类物体抓取中</text>

    <rect x="0" y="30" width="480" height="240" rx="8" fill="url(#pressBg)"/>

    <!-- 16行 x 32列 压力点，模拟绳状物体接触（中部高压区） -->
    <g id="tactArray">
    <!-- 用SVG生成一个类似真实触觉阵列的图案 -->
    <script/>
    </g>

    <!-- 手动绘制接触图案（3个高亮压力区模拟绳接触） -->
    <g transform="translate(20, 45)">
      <!-- 背景点阵 -->
      <g fill="#1e3a5f" opacity="0.4">
        <!-- 只画几行示意，用ellipse模拟 -->
      </g>
      <!-- 高压接触区 - 模拟绳子的三个接触点 -->
      <ellipse cx="120" cy="120" rx="55" ry="25" fill="#06b6d4" opacity="0.7">
        <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="240" cy="80" rx="45" ry="20" fill="#8b5cf6" opacity="0.7">
        <animate attributeName="opacity" values="0.6;0.9;0.6" dur="1.8s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="360" cy="150" rx="50" ry="22" fill="#ec4899" opacity="0.7">
        <animate attributeName="opacity" values="0.5;0.85;0.5" dur="2.2s" repeatCount="indefinite"/>
      </ellipse>
      <!-- 网格线 -->
      <g stroke="#334155" stroke-width="0.3" opacity="0.5">
        <!-- 行 -->
        <line x1="0" y1="15" x2="440" y2="15"/>
        <line x1="0" y1="30" x2="440" y2="30"/>
        <line x1="0" y1="45" x2="440" y2="45"/>
        <line x1="0" y1="60" x2="440" y2="60"/>
        <line x1="0" y1="75" x2="440" y2="75"/>
        <line x1="0" y1="90" x2="440" y2="90"/>
        <line x1="0" y1="105" x2="440" y2="105"/>
        <line x1="0" y1="120" x2="440" y2="120"/>
        <line x1="0" y1="135" x2="440" y2="135"/>
        <line x1="0" y1="150" x2="440" y2="150"/>
        <line x1="0" y1="165" x2="440" y2="165"/>
        <line x1="0" y1="180" x2="440" y2="180"/>
        <line x1="0" y1="195" x2="440" y2="195"/>
        <line x1="0" y1="210" x2="440" y2="210"/>
      </g>
      <!-- 列 -->
      <g stroke="#334155" stroke-width="0.3" opacity="0.3">
        <line x1="14" y1="0" x2="14" y2="225"/>
        <line x1="28" y1="0" x2="28" y2="225"/>
        <line x1="42" y1="0" x2="42" y2="225"/>
        <line x1="56" y1="0" x2="56" y2="225"/>
        <line x1="70" y1="0" x2="70" y2="225"/>
        <line x1="84" y1="0" x2="84" y2="225"/>
        <line x1="98" y1="0" x2="98" y2="225"/>
        <line x1="112" y1="0" x2="112" y2="225"/>
        <line x1="126" y1="0" x2="126" y2="225"/>
        <line x1="140" y1="0" x2="140" y2="225"/>
        <line x1="154" y1="0" x2="154" y2="225"/>
        <line x1="168" y1="0" x2="168" y2="225"/>
        <line x1="182" y1="0" x2="182" y2="225"/>
        <line x1="196" y1="0" x2="196" y2="225"/>
        <line x1="210" y1="0" x2="210" y2="225"/>
        <line x1="224" y1="0" x2="224" y2="225"/>
        <line x1="238" y1="0" x2="238" y2="225"/>
        <line x1="252" y1="0" x2="252" y2="225"/>
        <line x1="266" y1="0" x2="266" y2="225"/>
        <line x1="280" y1="0" x2="280" y2="225"/>
        <line x1="294" y1="0" x2="294" y2="225"/>
        <line x1="308" y1="0" x2="308" y2="225"/>
        <line x1="322" y1="0" x2="322" y2="225"/>
        <line x1="336" y1="0" x2="336" y2="225"/>
        <line x1="350" y1="0" x2="350" y2="225"/>
        <line x1="364" y1="0" x2="364" y2="225"/>
        <line x1="378" y1="0" x2="378" y2="225"/>
        <line x1="392" y1="0" x2="392" y2="225"/>
        <line x1="406" y1="0" x2="406" y2="225"/>
        <line x1="420" y1="0" x2="420" y2="225"/>
      </g>
      <text x="220" y="240" text-anchor="middle" font-size="10" fill="#64748b">32 列（横向）</text>
      <text x="-10" y="115" text-anchor="end" font-size="10" fill="#64748b" transform="rotate(-90 -10 115)">16 行</text>
    </g>

    <!-- 数据量标注 -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="480" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="240" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">阵列规格</text>
      <g font-size="12" fill="#475569">
        <text x="30" y="48">• 16 × 32 = 512 传感单元</text>
        <text x="30" y="68">• 每夹爪 2 路 × 双臂 = 4 路同步</text>
        <text x="260" y="48">• 采样率 ~30 FPS（与视频对齐）</text>
        <text x="260" y="68">• 配套触觉音频（FLAC 格式）</text>
      </g>
    </g>
  </g>

  <!-- 右：压力时间序列曲线 -->
  <g transform="translate(580, 90)">
    <text x="280" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">抓取过程压力均值变化（绳 vs 布）</text>
    <text x="280" y="18" text-anchor="middle" font-size="11" fill="#6b7280">归一化压力均值 · 抓取 → 握持 → 释放</text>

    <!-- 坐标系 -->
    <line x1="50" y1="40" x2="50" y2="300" stroke="#374151" stroke-width="1.5"/>
    <line x1="50" y1="300" x2="560" y2="300" stroke="#374151" stroke-width="1.5"/>

    <!-- 网格 -->
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="50" y1="90" x2="560" y2="90"/>
      <line x1="50" y1="150" x2="560" y2="150"/>
      <line x1="50" y1="210" x2="560" y2="210"/>
      <line x1="50" y1="260" x2="560" y2="260"/>
    </g>

    <!-- Y轴标签 -->
    <text x="45" y="45" text-anchor="end" font-size="11" fill="#6b7280">Max</text>
    <text x="45" y="150" text-anchor="end" font-size="11" fill="#6b7280">均值</text>
    <text x="45" y="300" text-anchor="end" font-size="11" fill="#6b7280">0</text>
    <text x="20" y="170" font-size="11" fill="#4b5563" transform="rotate(-90 20 170)" text-anchor="middle">压力（归一化）</text>

    <!-- X轴标签 -->
    <text x="50" y="318" text-anchor="middle" font-size="11" fill="#6b7280">0s</text>
    <text x="177" y="318" text-anchor="middle" font-size="11" fill="#6b7280">3s</text>
    <text x="305" y="318" text-anchor="middle" font-size="11" fill="#6b7280">6s</text>
    <text x="432" y="318" text-anchor="middle" font-size="11" fill="#6b7280">9s</text>
    <text x="560" y="318" text-anchor="middle" font-size="11" fill="#6b7280">12s</text>
    <text x="305" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">时间（抓取片段）</text>

    <!-- 阶段标注 -->
    <g font-size="11" fill="#9ca3af">
      <text x="110" y="362" text-anchor="middle" font-style="italic">接近</text>
      <text x="270" y="362" text-anchor="middle" font-style="italic">握持</text>
      <text x="460" y="362" text-anchor="middle" font-style="italic">释放</text>
    </g>
    <line x1="150" y1="355" x2="150" y2="40" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="400" y1="355" x2="400" y2="40" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- 绳 曲线 -->
    <polyline fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linejoin="round"
      points="50,280 80,270 110,240 140,180 170,130 200,100 230,85 260,80 290,78 320,82 350,88 380,95 410,120 440,180 470,230 500,260 530,275 560,280"/>

    <!-- 布 曲线 -->
    <polyline fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8,3"
      points="50,285 80,280 110,265 140,230 170,195 200,175 230,165 260,162 290,160 320,165 350,170 380,180 410,200 440,240 470,265 500,280 530,288 560,290"/>

    <!-- 图例 -->
    <g transform="translate(380, 45)">
      <rect x="0" y="0" width="170" height="50" rx="6" fill="white" stroke="#e5e7eb"/>
      <line x1="15" y1="18" x2="45" y2="18" stroke="#06b6d4" stroke-width="2.5"/>
      <text x="55" y="22" font-size="12" fill="#374151">绳（001-rope）</text>
      <line x1="15" y1="36" x2="45" y2="36" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="8,3"/>
      <text x="55" y="40" font-size="12" fill="#374151">布（008-pink-cloth）</text>
    </g>

    <!-- 数据点说明 -->
    <g transform="translate(20, 385)">
      <text x="0" y="0" font-size="12" fill="#4b5563">
        • 绳类物体：接触面积小，压力峰值高，握持阶段更稳定
      </text>
      <text x="0" y="20" font-size="12" fill="#4b5563">
        • 布料物体：接触面积大，压力分布均匀，整体压力值较低
      </text>
    </g>
  </g>

  <text x="600" y="585" text-anchor="middle" font-size="11" fill="#9ca3af">
    数据来源：Deform360 dataset (brownu/deform360) · 绳 10 片段 / 布 10 片段 · 每片段约 9~14 秒 · 完整 198 物体可用 CLI 下载
  </text>
</svg>