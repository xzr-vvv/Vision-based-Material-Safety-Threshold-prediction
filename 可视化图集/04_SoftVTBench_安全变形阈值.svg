    <!-- 图例 -->
    <g transform="translate(780, 365)">
      <rect x="0" y="0" width="300" height="55" rx="6" fill="white" stroke="#e5e7eb"/>
      <rect x="12" y="10" width="18" height="12" rx="2" fill="url(#dangerGrad)"/>
      <text x="38" y="20" font-size="11" fill="#374151">柔性物体 p90 变形</text>
      <rect x="12" y="30" width="18" height="12" rx="2" fill="url(#rigidGrad)"/>
      <text x="38" y="40" font-size="11" fill="#374151">刚体对照 p90 变形</text>
      <line x1="170" y1="16" x2="200" y2="16" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
      <text x="208" y="20" font-size="11" fill="#374151">d_safe 安全阈值</text>
    </g>
  </g>

  <text x="600" y="585" text-anchor="middle" font-size="11" fill="#9ca3af">
    数据来源：SoftVTBench (Arthur12137/SoftVTBench) · 20 操作任务 · 1628 条演示 · 唯一显式定义"安全变形阈值"的视触觉基准
  </text>
</svg>