<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="safeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="rigidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">SoftVTBench · 柔性物体安全变形阈值基准</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Isaac Sim FEM 仿真 · 显式 d_safe 安全阈值 · Safety Success 评价</text>

  <!-- 上方概览卡片 -->
  <g transform="translate(60, 85)">
    <rect x="0" y="0" width="240" height="80" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="120" y="30" text-anchor="middle" font-size="28" font-weight="700" fill="#065f46">100%</text>
    <text x="120" y="55" text-anchor="middle" font-size="13" fill="#065f46">刚体组 Goal Success</text>
    <text x="120" y="73" text-anchor="middle" font-size="11" fill="#047857">1000 / 1000 演示全成功</text>
  </g>

  <g transform="translate(320, 85)">
    <rect x="0" y="0" width="240" height="80" rx="10" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="120" y="30" text-anchor="middle" font-size="28" font-weight="700" fill="#92400e">75.6%</text>
    <text x="120" y="55" text-anchor="middle" font-size="13" fill="#92400e">柔性组 Goal Success</text>
    <text x="120" y="73" text-anchor="middle" font-size="11" fill="#b45309">756 / 1000 演示成功</text>
  </g>

  <g transform="translate(580, 85)">
    <rect x="0" y="0" width="240" height="80" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="120" y="30" text-anchor="middle" font-size="28" font-weight="700" fill="#991b1b">96~100%</text>
    <text x="120" y="55" text-anchor="middle" font-size="13" fill="#991b1b">超限率（over d_safe）</text>
    <text x="120" y="73" text-anchor="middle" font-size="11" fill="#b91c1c">几乎所有演示均过度变形</text>
  </g>

  <g transform="translate(840, 85)">
    <rect x="0" y="0" width="280" height="80" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="140" y="30" text-anchor="middle" font-size="28" font-weight="700" fill="#1e40af">10 物体</text>
    <text x="140" y="55" text-anchor="middle" font-size="13" fill="#1e40af">已标定 d_safe 安全阈值</text>
    <text x="140" y="73" text-anchor="middle" font-size="11" fill="#3b82f6">6 柔性 + 4 刚体对照</text>
  </g>

  <!-- 主体：d_safe 对比条形图 -->
  <g transform="translate(60, 200)">
    <text x="0" y="0" font-size="15" font-weight="600" fill="#1f2937">各物体 d_safe 安全阈值 vs 实际变形量</text>
    <text x="0" y="20" font-size="11" fill="#6b7280">绿色虚线 = d_safe（安全上限）· 柱体 = p90 实际变形量 · 超过即为过度变形</text>

    <!-- Y轴：物体名称（按d_safe从高到低） -->
    <!-- X轴：0 ~ 0.5 -->
    <g transform="translate(180, 40)">
      <!-- 基线 -->
      <line x1="0" y1="0" x2="900" y2="0" stroke="#d1d5db" stroke-width="1"/>
      <text x="0" y="355" font-size="11" fill="#6b7280">0.0</text>
      <text x="180" y="355" font-size="11" fill="#6b7280">0.1</text>
      <text x="360" y="355" font-size="11" fill="#6b7280">0.2</text>
      <text x="540" y="355" font-size="11" fill="#6b7280">0.3</text>
      <text x="720" y="355" font-size="11" fill="#6b7280">0.4</text>
      <text x="900" y="355" font-size="11" fill="#6b7280">0.5</text>
      <text x="450" y="378" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">变形量（相对单位）</text>

      <!-- 物体1: stw_cube_hq (刚体) d_safe=0.1571, p90=0.416 -->
      <g transform="translate(0, 0)">
        <text x="-10" y="18" text-anchor="end" font-size="12" fill="#1e40af" font-weight="600">cube (刚体)</text>
