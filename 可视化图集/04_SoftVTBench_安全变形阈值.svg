        <rect x="0" y="6" width="749" height="22" rx="4" fill="url(#rigidGrad)" opacity="0.8"/>
        <text x="760" y="22" font-size="11" fill="#4b5563">p90: 0.416</text>
        <!-- d_safe 虚线 -->
        <line x1="283" y1="0" x2="283" y2="34" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
        <circle cx="283" cy="17" r="4" fill="#059669"/>
        <text x="283" y="-3" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">0.157</text>
      </g>

      <!-- 物体2: pastry005 d_safe=0.1367, p90=0.468 -->
      <g transform="translate(0, 45)">
        <text x="-10" y="18" text-anchor="end" font-size="12" fill="#991b1b" font-weight="600">pastry005</text>
        <rect x="0" y="6" width="842" height="22" rx="4" fill="url(#dangerGrad)" opacity="0.7"/>
        <text x="853" y="22" font-size="11" fill="#4b5563">p90: 0.468</text>
        <line x1="246" y1="0" x2="246" y2="34" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
        <circle cx="246" cy="17" r="4" fill="#059669"/>
        <text x="246" y="-3" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">0.137</text>
      </g>

      <!-- 物体3: pastry001 d_safe=0.1248, p90=0.364 -->
      <g transform="translate(0, 90)">
        <text x="-10" y="18" text-anchor="end" font-size="12" fill="#991b1b" font-weight="600">pastry001</text>
        <rect x="0" y="6" width="655" height="22" rx="4" fill="url(#dangerGrad)" opacity="0.7"/>
        <text x="666" y="22" font-size="11" fill="#4b5563">p90: 0.364</text>
        <line x1="225" y1="0" x2="225" y2="34" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
        <circle cx="225" cy="17" r="4" fill="#059669"/>
        <text x="225" y="-3" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">0.125</text>
      </g>

      <!-- 物体4: stw_cylinder_hq (刚体) d_safe=0.0834, p90=0.448 -->
      <g transform="translate(0, 135)">
        <text x="-10" y="18" text-anchor="end" font-size="12" fill="#1e40af" font-weight="600">cylinder (刚体)</text>
        <rect x="0" y="6" width="806" height="22" rx="4" fill="url(#rigidGrad)" opacity="0.8"/>
        <text x="817" y="22" font-size="11" fill="#4b5563">p90: 0.448</text>
        <line x1="150" y1="0" x2="150" y2="34" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
        <circle cx="150" cy="17" r="4" fill="#059669"/>
        <text x="150" y="-3" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">0.083</text>
      </g>

      <!-- 物体5: pastry011 d_safe=0.0589, p90=0.273 -->
      <g transform="translate(0, 180)">
