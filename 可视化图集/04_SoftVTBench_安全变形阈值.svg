        <rect x="0" y="6" width="491" height="22" rx="4" fill="url(#dangerGrad)" opacity="0.7"/>
        <text x="502" y="22" font-size="11" fill="#4b5563">p90: 0.273</text>
        <line x1="106" y1="0" x2="106" y2="34" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
        <circle cx="106" cy="17" r="4" fill="#059669"/>
        <text x="106" y="-3" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">0.059</text>
      </g>

      <!-- 物体6: pastry010 d_safe=0.0502, p90=0.384 -->
      <g transform="translate(0, 225)">
        <text x="-10" y="18" text-anchor="end" font-size="12" fill="#991b1b" font-weight="600">pastry010</text>
        <rect x="0" y="6" width="691" height="22" rx="4" fill="url(#dangerGrad)" opacity="0.7"/>
        <text x="702" y="22" font-size="11" fill="#4b5563">p90: 0.384</text>
        <line x1="90" y1="0" x2="90" y2="34" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
        <circle cx="90" cy="17" r="4" fill="#059669"/>
        <text x="90" y="-3" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">0.050</text>
      </g>

      <!-- 物体7: pastry002 d_safe=0.0711, p90=0.477 -->
      <g transform="translate(0, 270)">
        <text x="-10" y="18" text-anchor="end" font-size="12" fill="#991b1b" font-weight="600">pastry002</text>
        <rect x="0" y="6" width="859" height="22" rx="4" fill="url(#dangerGrad)" opacity="0.7"/>
        <text x="870" y="22" font-size="11" fill="#4b5563">p90: 0.477</text>
        <line x1="128" y1="0" x2="128" y2="34" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
        <circle cx="128" cy="17" r="4" fill="#059669"/>
        <text x="128" y="-3" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">0.071</text>
      </g>

      <!-- 物体8: pastry003 d_safe=0.0406, p90=0.324 -->
      <g transform="translate(0, 315)">
        <text x="-10" y="18" text-anchor="end" font-size="12" fill="#991b1b" font-weight="600">pastry003</text>
        <rect x="0" y="6" width="583" height="22" rx="4" fill="url(#dangerGrad)" opacity="0.7"/>
        <text x="594" y="22" font-size="11" fill="#4b5563">p90: 0.324</text>
        <line x1="73" y1="0" x2="73" y2="34" stroke="#059669" stroke-width="2" stroke-dasharray="5,3"/>
        <circle cx="73" cy="17" r="4" fill="#059669"/>
        <text x="73" y="-3" text-anchor="middle" font-size="10" fill="#059669" font-weight="600">0.041</text>
      </g>
